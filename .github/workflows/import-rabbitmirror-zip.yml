name: RabbitMirror ZIP import

'on':
  push:
    branches:
      - main
      - tset
    paths:
      - rabbitmirror-upload.zip

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rabbitmirror-zip-import-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  import-zip:
    if: >
      github.repository == 'Zaiyebuzuoyouqingdetiangou/toto' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/tset')

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Validate and unpack the RabbitMirror plugin ZIP
        shell: python
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          import json
          import os
          import stat
          import subprocess
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          archive = root / "rabbitmirror-upload.zip"

          if not archive.is_file():
              print("No rabbitmirror-upload.zip found; nothing to import.")
              sys.exit(0)

          if archive.is_symlink():
              raise ValueError("rabbitmirror-upload.zip must not be a symbolic link.")

          if archive.stat().st_size > 25 * 1024 * 1024:
              raise ValueError("ZIP file exceeds the 25 MiB upload limit.")

          # Validate the complete ZIP before changing repository files.
          with zipfile.ZipFile(archive) as z:
              entries = [
                  item for item in z.infolist()
                  if not item.is_dir()
                  and not item.filename.startswith("__MACOSX/")
                  and PurePosixPath(item.filename).name != ".DS_Store"
              ]

              if not entries:
                  raise ValueError("The ZIP is empty.")

              if len(entries) > 5000:
                  raise ValueError("ZIP contains too many files.")

              unpacked_size = sum(item.file_size for item in entries)
              if unpacked_size > 100 * 1024 * 1024:
                  raise ValueError("Unpacked ZIP exceeds 100 MiB.")

              # Accept:
              #   manifest.json
              #   src/...
              #
              # or:
              #   toto-main/manifest.json
              #   toto-main/src/...
              #
              # Also tolerate another single outer directory as long as
              # manifest.json is found directly inside it.
              filenames = [item.filename for item in entries]

              prefix = ""

              if "manifest.json" not in filenames:
                  top_level = {
                      PurePosixPath(name).parts[0]
                      for name in filenames
                      if PurePosixPath(name).parts
                  }

                  if len(top_level) == 1:
                      candidate = next(iter(top_level)) + "/"
                      if candidate + "manifest.json" in filenames:
                          prefix = candidate

              payload = {}
              seen = set()

              for info in entries:
                  if prefix and not info.filename.startswith(prefix):
                      raise ValueError(
                          "ZIP contains files outside the detected plugin root: "
                          + repr(info.filename)
                      )

                  name = info.filename[len(prefix):] if prefix else info.filename

                  if not name:
                      continue

                  parts = PurePosixPath(name).parts

                  if (
                      "\\" in name
                      or ":" in name
                      or "\x00" in name
                      or not parts
                      or any(part in ("", ".", "..", ".git", ".github") for part in parts)
                      or parts[0].startswith(".git")
                      or name == "rabbitmirror-upload.zip"
                      or name.casefold() in seen
                  ):
                      raise ValueError(
                          "Unsafe or duplicate ZIP path: " + repr(name)
                      )

                  mode = info.external_attr >> 16
                  if stat.S_IFMT(mode) not in (0, stat.S_IFREG):
                      raise ValueError(
                          "Only regular files may be imported: " + repr(name)
                      )

                  destination = root.joinpath(*parts)

                  for parent in [destination, *destination.parents]:
                      if parent == root:
                          break
                      if parent.is_symlink():
                          raise ValueError(
                              "Refusing to overwrite or follow a symbolic link: "
                              + repr(name)
                          )

                  if destination.is_dir():
                      raise ValueError(
                          "File/directory conflict: " + repr(name)
                      )

                  if any(
                      parent.exists() and not parent.is_dir()
                      for parent in destination.parents
                      if parent != root
                  ):
                      raise ValueError(
                          "Parent file/directory conflict: " + repr(name)
                      )

                  seen.add(name.casefold())
                  payload[name] = z.read(info)

          # Required RabbitMirror files.
          required = (
              "manifest.json",
              "index.js",
              "src/injector.js",
              "src/settings.js",
          )

          missing = [
              name for name in required
              if name not in payload or not payload[name]
          ]

          if missing:
              raise ValueError(
                  "Not a complete RabbitMirror ZIP. Missing: "
                  + ", ".join(missing)
              )

          # Validate manifest identity.
          manifest = json.loads(
              payload["manifest.json"].decode("utf-8-sig")
          )

          expected_homepage = (
              "https://github.com/"
              + os.environ["EXPECTED_REPOSITORY"]
          )

          actual_homepage = str(
              manifest.get("homePage", "")
          ).rstrip("/")

          if actual_homepage.lower() != expected_homepage.lower():
              raise ValueError(
                  "manifest.json homePage does not match this repository."
              )

          if manifest.get("display_name") != "兔子镜小剧场":
              raise ValueError(
                  "manifest.json display_name must be 兔子镜小剧场."
              )

          if str(manifest.get("js", "")).split("?", 1)[0] != "index.js":
              raise ValueError(
                  "Unexpected RabbitMirror entry point."
              )

          # Reject paths where one ZIP file would also have to become
          # a parent directory of another ZIP file.
          for name in payload:
              for parent in PurePosixPath(name).parents:
                  if str(parent) == ".":
                      continue
                  if str(parent).casefold() in seen:
                      raise ValueError(
                          "Conflicting file paths inside ZIP: "
                          + repr(name)
                      )

          # Overlay import:
          # files contained in the ZIP are replaced/created.
          # Existing repository files absent from the ZIP are preserved.
          #
          # This deliberately preserves:
          #   .github/workflows/
          #   repository docs
          #   other files not shipped inside the plugin ZIP
          for name, content in payload.items():
              target = root / name
              target.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )
              target.write_bytes(content)

          # Remove the transport ZIP after a successful validation/import.
          archive.unlink()

          # Stage only files imported from ZIP plus deletion of upload ZIP.
          paths = [
              *payload.keys(),
              "rabbitmirror-upload.zip",
          ]

          subprocess.run(
              [
                  "git",
                  "--literal-pathspecs",
                  "add",
                  "-f",
                  "--pathspec-from-file=-",
                  "--pathspec-file-nul",
              ],
              input=(
                  b"\x00".join(
                      path.encode("utf-8")
                      for path in paths
                  )
                  + b"\x00"
              ),
              check=True,
          )

          branch = os.environ["TARGET_BRANCH"]

          print(
              f"Prepared {len(payload)} RabbitMirror files "
              f"for branch {branch}."
          )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary:
              with open(
                  summary,
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "## RabbitMirror ZIP import\n\n"
                      f"- Target branch: `{branch}`\n"
                      f"- Prepared plugin files: **{len(payload)}**\n"
                      "- `rabbitmirror-upload.zip` will be removed after import.\n"
                      "- Existing repository files absent from the ZIP are preserved.\n"
                  )

      - name: Commit all imported files together
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo 'Nothing changed; no import commit was created.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            -c core.hooksPath=/dev/null \
            -c commit.gpgsign=false \
            commit -m "Import RabbitMirror plugin ZIP (${TARGET_BRANCH})"

          # Push only to the branch that triggered this workflow.
          # No force push and no cross-branch promotion.
          git push origin "HEAD:${TARGET_BRANCH}"

          echo \
            "RabbitMirror import committed and pushed to \`${TARGET_BRANCH}\` successfully." \
            >> "$GITHUB_STEP_SUMMARY"
